# Ruff configuration for matrix-mcp.
line-length = 100
target-version = "py312"

[lint]
# Pin the rule set explicitly (pyflakes F + pycodestyle E4/E7/E9) rather than
# relying on ruff's implicit default, which widens across releases and would
# otherwise leak new rules in on a ruff upgrade. Ruff itself is pinned in CI.
select = ["E4", "E7", "E9", "F"]

[lint.per-file-ignores]
# server.py intentionally loads dotenv and fail-fast validates the required
# MATRIX_* env vars before importing modules that read the environment or open
# network connections at import time. This requires imports below that block.
"server.py" = ["E402"]
