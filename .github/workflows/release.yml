name: Release

on:
  push:
    tags:
      - "v*"

# Read at the top; the one job that creates the release escalates below.
permissions:
  contents: read

# Source-only release (no PyPI): a tag `vX.Y.Z` cuts a GitHub Release with auto-generated notes.
jobs:
  create-github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required for gh release create

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          # gh reads GH_TOKEN from the step env; no token left in .git/config.
          persist-credentials: false

      - name: Create GitHub Release (source only)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "${TAG_NAME}" &>/dev/null; then
            echo "Release ${TAG_NAME} already exists; nothing to do."
          else
            gh release create "${TAG_NAME}" \
              --title "${TAG_NAME}" \
              --generate-notes \
              --verify-tag
          fi
